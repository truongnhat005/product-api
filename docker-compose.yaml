services:
  mongodb:
    image: mongo:8
    container_name: nammongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: "123456"

    volumes:
      - mongodb_data:/data/db

    networks:
      - product-network

    healthcheck:
      test: ["CMD", "mongosh", "--username", "admin", "--password", "123456", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  product-api:
    build: .
    container_name: product-api-container
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      MONGO_URI: mongodb://admin:123456@mongodb:27017/productdb?authSource=admin
      PORT: 3000

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - product-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  product-network:
    driver: bridge

volumes:
  mongodb_data: